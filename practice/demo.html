<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      .selected {
        background: #0f0;
      }

      li {
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    Click on a list item to select it.
    <br />

    <ul id="ul">
      <li>Christopher Robin</li>
      <li>Winnie-the-Pooh</li>
      <li>Tigger</li>
      <li>Kanga</li>
      <li>Rabbit. Just rabbit.</li>
    </ul>

    <script>
      ulbtn = document.querySelector("#ul");
      ulbtn.addEventListener("mousedown", (e) => {
        if (e.tagName == "li") {
          alert("hello");
        }
      });
    </script>
  </body>
</html>
