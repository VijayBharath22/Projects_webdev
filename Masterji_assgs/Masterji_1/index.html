<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qoute Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="quote-container">
        <div class="quote"></div>
        <div class="author"></div>
      </div>
      <div class="quote-container-buttons">
        <button class="add-quote-button">ADD QUOTE</button>
        <div>
          <button class="export-button" title="download quote as pdf">
            ⬇️
          </button>
          <button class="copy-clipboard-button" title="copy to clipboard">
            📋
          </button>
          <button class="share-button" title="share">📤</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
